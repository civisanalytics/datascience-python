name: Build and test image
description: Build the test target and run the image test suite.

# A composite action rather than a reusable workflow so its steps run inside the
# caller's job, sharing one Buildx instance with the production build that
# follows. The production build then reuses these exact layers instead of
# rebuilding them.
#
# No cross-run layer cache, deliberately: every publish builds from scratch so
# the Dockerfile's apt-get install picks up whatever upstream has at that moment.

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build the test image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: test
        load: true
        push: false
        tags: ds-python:test

    - name: Run the image test suite
      shell: bash
      run: docker run --rm ds-python:test /test_image.py -vv
